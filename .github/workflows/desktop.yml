# Builds the Windows installer for the Erendyl Codex Companion desktop app.
#
# No local Rust toolchain needed: push (or run this manually from the Actions
# tab), wait ~10 minutes, download the .exe from the run's artifacts, hand it
# to your players. Runs only when desktop/ changes, so normal website pushes
# don't spend CI minutes on it.
name: desktop-app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/desktop.yml"]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install frontend dependencies
        run: npm ci
        working-directory: desktop

      - name: Build Tauri app
        run: npm run tauri build
        working-directory: desktop

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: erendyl-codex-windows-installer
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
